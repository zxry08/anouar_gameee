<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>من سيربح الأبرور — Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <h1 class="big-title">من سيربح الأبرور</h1>
    <div class="start-controls">
      <button class="lang-toggle active" data-lang="ar">عربي</button>
      <button class="lang-toggle" data-lang="en">English</button>
    </div>

    <div class="level-buttons">
      <button class="level-btn" data-level="easy">Easy</button>
      <button class="level-btn" data-level="medium">Medium</button>
      <button class="level-btn" data-level="hard">Hard</button>
    </div>

    <div class="hint">اختار المستوى و اللغة وبدا اللعب</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <header class="game-header">
      <div class="title-left">
        <div class="game-title">من سيربح الأبرور</div>
        <div class="small-controls">
          <button id="homeBtn" class="control-btn">Home</button>
          <button id="muteBtn" class="control-btn">Mute</button>
        </div>
      </div>

      <div class="title-right">
        <div class="level-indicator" id="levelName">Easy</div>
        <div class="lang-indicator">
          <button class="lang-toggle active" data-lang="ar">عربي</button>
          <button class="lang-toggle" data-lang="en">English</button>
        </div>
      </div>
    </header>

    <main class="game-container">
      <!-- Host (left) -->
      <aside class="host">
        <img src="host.png" alt="Host" id="hostImg">
      </aside>

      <!-- Question area (right) -->
      <section class="question-area">
        <div class="timer-wrap">
          <div id="timerBar" class="timer-bar"><div id="timerFill" class="timer-fill"></div></div>
          <div id="timerText" class="timer-text">30s</div>
        </div>

        <div class="question-card" id="questionCard">
          <div id="questionText" class="question-text">...loading</div>

          <div class="answers" id="answers">
            <!-- buttons injected -->
          </div>

          <div class="progress-row">
            <div id="qProgress" class="q-progress"><div id="qProgressFill"></div></div>
            <div id="scoreText" class="score-text">0 / 10</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- END/RESULT SCREEN -->
  <div id="endScreen" class="screen">
    <h2 id="endTitle">Game Over</h2>
    <div id="endScore" class="end-score">Your score: 0 / 10</div>
    <div class="end-actions">
      <button id="playAgain" class="control-btn">Play Again</button>
      <button id="backHome" class="control-btn">Home</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
